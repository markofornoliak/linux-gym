name: Linux Gym CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "linux-gym-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check shell.js
          node --check app.js
          node --check tests/selftest.cjs

      - name: Run curriculum and shell self-test
        run: node tests/selftest.cjs

      - name: Verify static application
        run: |
          test -f index.html
          test -f styles.css
          test -f data.js
          test -f shell.js
          test -f app.js
          grep -q 'data.js' index.html
          grep -q 'shell.js' index.html
          grep -q 'app.js' index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
