name: Linux Gym CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "linux-gym-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check shell.js
          node --check runtime-fixes.js
          node --check app.js
          node --check tests/selftest.cjs

      - name: Run curriculum and shell self-test
        run: node tests/selftest.cjs

      - name: Verify static application
        run: |
          test -f index.html
          test -f styles.css
          test -f responsive.css
          test -f data.js
          test -f shell.js
          test -f runtime-fixes.js
          test -f app.js
          grep -q 'responsive.css' index.html
          grep -q 'data.js' index.html
          grep -q 'shell.js' index.html
          grep -q 'runtime-fixes.js' index.html
          grep -q 'app.js' index.html

      - name: Browser smoke test
        run: |
          google-chrome --version
          python3 -m http.server 4173 >/tmp/linux-gym-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom http://127.0.0.1:4173/ > /tmp/linux-gym-dom.html
          grep -q 'Shell Fundamentals' /tmp/linux-gym-dom.html
          grep -q '124 missions' /tmp/linux-gym-dom.html
          grep -q 'student@linux-gym' /tmp/linux-gym-dom.html
          grep -q 'mobileTabs' /tmp/linux-gym-dom.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages response
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          verified=0
          for i in {1..30}; do
            if curl -fsSL "$LIVE_URL" -o /tmp/linux-gym-live.html; then
              if grep -q 'runtime-fixes.js' /tmp/linux-gym-live.html && grep -q 'responsive.css' /tmp/linux-gym-live.html && grep -q 'Linux Gym' /tmp/linux-gym-live.html; then
                verified=1
                break
              fi
            fi
            sleep 2
          done
          test "$verified" = "1"
          echo "Live Pages verification passed: $LIVE_URL"
